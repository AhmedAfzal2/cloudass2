apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: REPLACE_WITH_ARTIFACT_REGISTRY/frontend-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: STUDENT_SERVICE_URL
              value: "http://student-service"
            - name: COURSE_SERVICE_URL
              value: "http://course-service"
            - name: ENROLLMENT_SERVICE_URL
              value: "http://enrollment-service"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend-service
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
